<div class="gua-sheet gua-cart-layer" data-variant-sheet hidden>
  <button class="gua-sheet__backdrop" type="button" data-close-sheet aria-label="Đóng bảng chỉnh sửa"></button>
  <section class="gua-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="variant-sheet-title" tabindex="-1">
    <div class="gua-sheet__handle" aria-hidden="true"></div>
    <header class="gua-sheet__head">
      <div>
        <p>Chỉnh ngay trong giỏ</p>
        <h2 id="variant-sheet-title">Chọn lại phân loại</h2>
      </div>
      <button type="button" data-close-sheet aria-label="Đóng">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>

    <div class="gua-sheet__product" data-sheet-product hidden>
      <img data-sheet-image src="" alt="">
      <div>
        <strong data-sheet-name></strong>
        <span data-sheet-current></span>
      </div>
    </div>

    <div class="gua-sheet__status" data-sheet-status role="status" aria-live="polite">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      Đang tải các phân loại còn hàng…
    </div>

    <div class="gua-sheet__picker" data-variant-picker hidden>
      <section class="gua-sheet__group" data-color-group>
        <div class="gua-sheet__group-head">
          <div>
            <span>Bước 1</span>
            <h3>Màu sắc</h3>
          </div>
          <small data-color-help>Chọn màu bạn muốn.</small>
        </div>
        <div class="gua-sheet__colors" data-color-options role="group" aria-label="Chọn màu sắc"></div>
      </section>

      <section class="gua-sheet__group">
        <div class="gua-sheet__group-head">
          <div>
            <span>Bước 2</span>
            <h3>Kích thước</h3>
          </div>
          <small>Chỉ các size còn hàng mới chọn được.</small>
        </div>
        <div class="gua-sheet__sizes" data-size-options role="group" aria-label="Chọn kích thước"></div>
      </section>

      <div class="gua-sheet__selection" data-variant-selection aria-live="polite">
        <span><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Phân loại sẽ áp dụng</span>
        <strong data-selected-variant>Vui lòng chọn màu và size</strong>
        <small data-selected-stock></small>
      </div>
    </div>

    <footer class="gua-sheet__footer">
      <button type="button" class="gua-sheet__cancel" data-close-sheet>Hủy</button>
      <button type="button" class="gua-sheet__save" data-save-variant disabled>
        <span>Cập nhật sản phẩm</span>
        <i class="fa-solid fa-arrow-right-long"></i>
      </button>
    </footer>
  </section>
</div>
