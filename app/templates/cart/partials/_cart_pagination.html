{% if cart_page.total_pages > 1 %}
  <nav class="gua-cart-pagination" aria-label="Phân trang giỏ hàng">
    {% if cart_page.page > 1 %}
      <a href="{{ url_for('cart.index', page=cart_page.page - 1, q=cart_page.query or None) }}" aria-label="Trang trước">
        <i class="fa-solid fa-arrow-left-long"></i>
      </a>
    {% else %}
      <span aria-hidden="true"><i class="fa-solid fa-arrow-left-long"></i></span>
    {% endif %}

    <p>
      <b>{{ cart_page.page }}</b>
      <small>/ {{ cart_page.total_pages }}</small>
    </p>

    {% if cart_page.page < cart_page.total_pages %}
      <a href="{{ url_for('cart.index', page=cart_page.page + 1, q=cart_page.query or None) }}" aria-label="Trang sau">
        <i class="fa-solid fa-arrow-right-long"></i>
      </a>
    {% else %}
      <span aria-hidden="true"><i class="fa-solid fa-arrow-right-long"></i></span>
    {% endif %}
  </nav>
{% endif %}
