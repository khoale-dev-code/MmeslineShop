<aside class="gua-cart-summary" aria-label="Tóm tắt phần đã chọn">
  <div class="gua-cart-summary__card">
    <div class="gua-cart-summary__head">
      <div>
        <p>Phần bạn sẽ mua</p>
        <h2>Tóm tắt lựa chọn</h2>
      </div>
      <span><i class="fa-solid fa-check" aria-hidden="true"></i></span>
    </div>

    <div class="gua-cart-summary__rows">
      <div>
        <span>Sản phẩm đã chọn</span>
        <strong data-summary-lines>0</strong>
      </div>
      <div>
        <span>Tổng số lượng</span>
        <strong data-summary-quantity>0</strong>
      </div>
      <div class="gua-cart-summary__total">
        <span>Tạm tính</span>
        <strong data-summary-total>0 ₫</strong>
      </div>
    </div>

    <button type="button" class="gua-cart-summary__checkout" data-checkout disabled>
      <span>Thanh toán sản phẩm đã chọn</span>
      <i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>
    </button>

    <p class="gua-cart-summary__hint" data-summary-hint>
      Chọn ít nhất một sản phẩm để tiếp tục.
    </p>

    <ul class="gua-cart-summary__trust">
      <li><i class="fa-solid fa-shield-halved"></i> Giá và tồn kho được kiểm tra lại ở server</li>
      <li><i class="fa-solid fa-arrows-rotate"></i> Đổi size, màu ngay trong giỏ</li>
      <li><i class="fa-solid fa-lock"></i> COD, VNPay và SePay an toàn</li>
    </ul>

    <a href="/shop" class="gua-cart-summary__continue" data-nav>
      <i class="fa-solid fa-arrow-left-long"></i>
      Tiếp tục mua sắm
    </a>
  </div>
</aside>
