{# QUICK VIEW — GUAMAISON Compact #}

<style>
  :root{
    --qv-ink:#111;
    --qv-muted:#777;
    --qv-soft:#f6f6f6;
    --qv-line:#e7e7e7;
    --qv-radius:5px;
  }

  #quick-view-modal *{box-sizing:border-box}

  #quick-view-modal{
    font-family:"DM Sans","Inter",system-ui,sans-serif;
  }

  #quick-view-modal .qv-panel{
    width:min(820px,calc(100vw - 24px));
    max-height:min(82dvh,680px);
    border-radius:var(--qv-radius);
    background:#fff;
    overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.22);
    transform:translateY(10px) scale(.985);
    transition:transform .22s cubic-bezier(.16,1,.3,1);
  }

  #quick-view-modal.opacity-100 .qv-panel{
    transform:translateY(0) scale(1);
  }

  #quick-view-modal .qv-media{
    position:relative;
    background:var(--qv-soft);
    min-height:360px;
    overflow:hidden;
  }

  #quick-view-modal .qv-slide{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:18px;
    opacity:0;
    transform:translateX(16px);
    transition:.28s cubic-bezier(.16,1,.3,1);
  }

  #quick-view-modal .qv-slide.qv-active{
    opacity:1;
    transform:none;
    z-index:2;
  }

  #quick-view-modal .qv-slide img{
    width:100%;
    height:100%;
    max-height:460px;
    object-fit:contain;
    display:block;
  }

  #quick-view-modal .qv-close,
  #quick-view-modal .qv-nav{
    position:absolute;
    z-index:20;
    display:grid;
    place-items:center;
    width:34px;
    height:34px;
    border:1px solid rgba(0,0,0,.08);
    border-radius:var(--qv-radius);
    background:rgba(255,255,255,.9);
    color:#111;
    transition:.16s ease;
  }

  #quick-view-modal .qv-close:hover,
  #quick-view-modal .qv-nav:hover{
    background:#111;
    color:#fff;
  }

  #quick-view-modal .qv-close{
    right:12px;
    top:12px;
  }

  #quick-view-modal .qv-nav{
    top:50%;
    transform:translateY(-50%);
  }

  #quick-view-modal .qv-nav.prev{left:10px}
  #quick-view-modal .qv-nav.next{right:10px}

  #quick-view-modal .qv-dots{
    position:absolute;
    left:50%;
    bottom:12px;
    z-index:20;
    display:flex;
    gap:5px;
    transform:translateX(-50%);
  }

  #quick-view-modal .qv-dot{
    width:16px;
    height:2px;
    border:0;
    border-radius:99px;
    background:rgba(0,0,0,.24);
    padding:0;
  }

  #quick-view-modal .qv-dot.qv-dot-active{
    width:28px;
    background:#111;
  }

  #quick-view-modal .qv-info{
    max-height:min(82dvh,680px);
    overflow:auto;
    padding:26px;
  }

  #quick-view-modal .qv-info::-webkit-scrollbar{
    display:none;
  }

  #quick-view-modal .qv-kicker{
    font-size:9px;
    font-weight:850;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--qv-muted);
  }

  #quick-view-modal .qv-title{
    margin-top:8px;
    font-size:clamp(21px,2.1vw,28px);
    line-height:1.12;
    font-weight:760;
    letter-spacing:-.025em;
    color:#111;
    text-wrap:balance;
  }

  #quick-view-modal .qv-price{
    font-size:20px;
    font-weight:850;
    letter-spacing:-.02em;
    color:#111;
  }

  #quick-view-modal .qv-old-price{
    font-size:12px;
    font-weight:700;
    color:#aaa;
    text-decoration:line-through;
  }

  #quick-view-modal .qv-stock{
    min-height:18px;
    font-size:10px;
    font-weight:850;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  #quick-view-modal .qv-section{
    padding-top:17px;
    border-top:1px solid var(--qv-line);
  }

  #quick-view-modal .qv-label{
    font-size:10px;
    font-weight:850;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#111;
  }

  #quick-view-modal .qv-sub{
    font-size:10px;
    font-weight:750;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--qv-muted);
  }

  #quick-view-modal .qv-swatch{
    width:30px;
    height:30px;
    border:1px solid var(--qv-line);
    border-radius:var(--qv-radius);
    background:#ddd;
    cursor:pointer;
  }

  #quick-view-modal .qv-swatch.qv-sel{
    border-color:#111;
    box-shadow:0 0 0 2px #111 inset;
  }

  #quick-view-modal .qv-size{
    min-width:44px;
    height:36px;
    padding:0 12px;
    border:1px solid var(--qv-line);
    border-radius:var(--qv-radius);
    background:#fff;
    color:#111;
    font-size:10px;
    font-weight:850;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  #quick-view-modal .qv-size.qv-sel{
    background:#111;
    border-color:#111;
    color:#fff;
  }

  #quick-view-modal .qv-size:disabled{
    background:#f4f4f4;
    color:#aaa;
    text-decoration:line-through;
    cursor:not-allowed;
  }

  #quick-view-modal .qv-qty{
    display:grid;
    grid-template-columns:34px 38px 34px;
    height:44px;
    border:1px solid #111;
    border-radius:var(--qv-radius);
    overflow:hidden;
  }

  #quick-view-modal .qv-qty button{
    font-size:17px;
    color:#555;
  }

  #quick-view-modal .qv-qty button:hover{
    background:#f5f5f5;
    color:#111;
  }

  #quick-view-modal .qv-qty input{
    width:100%;
    border:0;
    outline:0;
    text-align:center;
    font-size:12px;
    font-weight:850;
    background:transparent;
    pointer-events:none;
  }

  #quick-view-modal .qv-submit,
  #quick-view-modal .qv-detail{
    height:44px;
    border-radius:var(--qv-radius);
    font-size:10px;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  #quick-view-modal .qv-submit{
    border:1px solid #111;
    background:#111;
    color:#fff;
  }

  #quick-view-modal .qv-submit:hover:not(:disabled){
    background:#333;
  }

  #quick-view-modal .qv-submit:disabled{
    border-color:#e5e5e5;
    background:#f1f1f1;
    color:#aaa;
  }

  #quick-view-modal .qv-detail{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:1px solid var(--qv-line);
    background:#fff;
    color:#111;
  }

  #quick-view-modal .qv-detail:hover{
    border-color:#111;
  }

 @media(max-width:767px){
  #quick-view-modal{
    align-items:flex-end;
    justify-content:center;
    padding:0;
    background:rgba(0,0,0,.48);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }

  #quick-view-modal .qv-panel{
    width:100%;
    height:auto;
    max-height:92dvh;
    grid-template-columns:1fr;
    border-radius:18px 18px 0 0;
    overflow:hidden;
    box-shadow:0 -18px 50px rgba(0,0,0,.18);
    transform:translateY(22px);
  }

  #quick-view-modal.opacity-100 .qv-panel{
    transform:translateY(0);
  }

  #quick-view-modal .qv-panel::before{
    content:"";
    position:absolute;
    left:50%;
    top:8px;
    z-index:30;
    width:44px;
    height:4px;
    border-radius:999px;
    background:rgba(0,0,0,.18);
    transform:translateX(-50%);
  }

  #quick-view-modal .qv-close{
    top:14px;
    right:14px;
    width:38px;
    height:38px;
    border-radius:999px;
    background:rgba(255,255,255,.94);
    box-shadow:0 12px 26px rgba(0,0,0,.12);
  }

  #quick-view-modal .qv-media{
    min-height:0;
    height:38dvh;
    max-height:330px;
    background:#f5f5f5;
  }

  #quick-view-modal .qv-slide{
    padding:18px 42px 22px;
  }

  #quick-view-modal .qv-slide img{
    width:100%;
    height:100%;
    max-height:none;
    object-fit:contain;
  }

  #quick-view-modal .qv-nav{
    width:34px;
    height:34px;
    border-radius:999px;
    background:rgba(255,255,255,.92);
    box-shadow:0 10px 22px rgba(0,0,0,.1);
  }

  #quick-view-modal .qv-nav.prev{
    left:10px;
  }

  #quick-view-modal .qv-nav.next{
    right:10px;
  }

  #quick-view-modal .qv-dots{
    bottom:10px;
  }

  #quick-view-modal .qv-dot{
    width:14px;
    height:3px;
    background:rgba(0,0,0,.2);
  }

  #quick-view-modal .qv-dot.qv-dot-active{
    width:28px;
    background:#111;
  }

  #quick-view-modal .qv-info{
    max-height:54dvh;
    overflow:auto;
    padding:18px 16px calc(96px + env(safe-area-inset-bottom, 0px));
    -webkit-overflow-scrolling:touch;
  }

  #quick-view-modal .qv-kicker{
    font-size:8px;
    letter-spacing:.18em;
  }

  #quick-view-modal .qv-title{
    margin-top:7px;
    font-size:20px;
    line-height:1.16;
    letter-spacing:-.035em;
  }

  #quick-view-modal .qv-price{
    font-size:19px;
  }

  #quick-view-modal .qv-stock{
    margin-top:8px;
    font-size:9px;
  }

  #quick-view-modal .qv-section{
    padding-top:14px;
  }

  #quick-view-modal .qv-label{
    font-size:9px;
    letter-spacing:.14em;
  }

  #quick-view-modal .qv-sub{
    font-size:9px;
  }

  #quick-view-modal .qv-swatch{
    width:34px;
    height:34px;
    border-radius:999px;
  }

  #quick-view-modal .qv-swatch.qv-sel{
    box-shadow:0 0 0 2px #fff inset, 0 0 0 2px #111;
  }

  #quick-view-modal .qv-size{
    min-width:42px;
    height:34px;
    padding:0 11px;
    border-radius:999px;
    font-size:10px;
  }

  #quick-view-modal .qv-mobile-action{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:40;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 -16px 42px rgba(0,0,0,.08);
  }

  #quick-view-modal .qv-mobile-action-grid{
    display:grid;
    grid-template-columns:94px 1fr 44px;
    gap:8px;
    align-items:center;
  }

  #quick-view-modal .qv-qty{
    grid-template-columns:30px 34px 30px;
    height:42px;
    border-radius:999px;
    border-color:#d9d9d9;
    background:#fff;
  }

  #quick-view-modal .qv-qty button{
    font-size:16px;
  }

  #quick-view-modal .qv-submit{
    height:44px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:10px;
    letter-spacing:.13em;
    white-space:nowrap;
  }

  #quick-view-modal .qv-submit::before{
    content:"\f217";
    font-family:"Font Awesome 6 Free";
    font-weight:900;
    font-size:12px;
    line-height:1;
  }

  #quick-view-modal .qv-submit:disabled::before{
    content:"\f05e";
  }

  #quick-view-modal .qv-detail{
    width:44px;
    height:44px;
    margin:0;
    padding:0;
    border-radius:999px;
    font-size:0;
  }

  #quick-view-modal .qv-detail i{
    font-size:12px;
  }

  #quick-view-modal .qv-detail .qv-detail-text{
    display:none;
  }
  }
</style>

<div
  id="quick-view-modal"
  class="fixed inset-0 z-[220] hidden items-center justify-center bg-black/50 px-3 opacity-0 backdrop-blur-[3px] transition-opacity duration-200 sm:px-5"
  aria-hidden="true"
>
  <button type="button" class="absolute inset-0" onclick="closeQuickView()" aria-label="Đóng"></button>

  <section id="qv-inner" class="qv-panel relative z-10 grid grid-cols-1 md:grid-cols-[46%_54%]" role="dialog" aria-modal="true">
    <button type="button" class="qv-close" onclick="closeQuickView()" aria-label="Đóng">
      <i class="fa-solid fa-xmark text-sm"></i>
    </button>

    <div class="qv-media">
      <div id="qv-slides" class="absolute inset-0"></div>

      <button type="button" class="qv-nav prev" onclick="qvSlide(-1)" aria-label="Ảnh trước">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>

      <button type="button" class="qv-nav next" onclick="qvSlide(1)" aria-label="Ảnh sau">
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>

      <div id="qv-dots" class="qv-dots"></div>
    </div>

    <div class="qv-info">
      <p id="qv-category" class="qv-kicker">Collection</p>

      <h2 id="qv-name" class="qv-title">Product Name</h2>

      <div class="mt-4 flex flex-wrap items-baseline gap-3">
        <span id="qv-price" class="qv-price">0₫</span>
        <span id="qv-price-original" class="qv-old-price hidden"></span>
      </div>

      <div id="qv-stock-status" class="qv-stock mt-3"></div>

      <form action="/cart/add" method="POST" class="mt-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="product_id" id="qv-input-id">
        <input type="hidden" name="variant_id" id="qv-variant-id">

        <section id="qv-color-section" class="qv-section hidden">
          <div class="mb-3 flex items-center justify-between gap-3">
            <span class="qv-label">Màu sắc</span>
            <span id="qv-color-label" class="qv-sub"></span>
          </div>
          <div id="qv-colors" class="flex flex-wrap gap-2"></div>
        </section>

        <section id="qv-size-section" class="qv-section mt-5 hidden">
          <div class="mb-3 flex items-center justify-between gap-3">
            <span class="qv-label">Kích thước</span>
            <span class="qv-sub">Chọn size</span>
          </div>
          <div id="qv-sizes" class="flex flex-wrap gap-2"></div>
        </section>

       <div class="qv-mobile-action mt-6 border-t border-[#e7e7e7] pt-4">
        <div class="qv-mobile-action-grid">
          <div class="qv-qty">
            <button type="button" onclick="qvChangeQty(-1)" aria-label="Giảm số lượng">−</button>
            <input id="qv-qty" name="quantity" type="number" value="1" readonly>
            <button type="button" onclick="qvChangeQty(1)" aria-label="Tăng số lượng">+</button>
          </div>

          <button type="submit" id="qv-submit-btn" class="qv-submit">
            Thêm vào giỏ
          </button>

          <a id="qv-detail-link" href="#" class="qv-detail" aria-label="Xem chi tiết sản phẩm">
            <span class="qv-detail-text">Xem chi tiết</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </a>
        </div>
      </div>
      </form>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  const $ = (s,r=document) => r.querySelector(s);
  const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));

  const COLORS = {
    "đen":"#111","black":"#111","trắng":"#fff","white":"#fff","đỏ":"#dc2626","red":"#dc2626",
    "xanh dương":"#2563eb","blue":"#2563eb","navy":"#1e3a8a","xanh navy":"#1e3a8a",
    "xanh lá":"#16a34a","green":"#16a34a","vàng":"#eab308","yellow":"#eab308",
    "cam":"#ea580c","orange":"#ea580c","hồng":"#ec4899","pink":"#ec4899",
    "tím":"#9333ea","purple":"#9333ea","xám":"#6b7280","gray":"#6b7280","grey":"#6b7280",
    "nâu":"#78350f","brown":"#78350f","be":"#d4c5b0","beige":"#d4c5b0","kem":"#fef3c7","cream":"#fef3c7"
  };

  const QV = {imgs:[],i:0,variants:[],base:0,max:1};

  const money = v => Number(v || 0).toLocaleString("vi-VN") + "₫";
  const safe = v => String(v || "").replace(/"/g,"&quot;");
  const hex = n => COLORS[String(n || "").toLowerCase().trim()] || "#ccc";

  function json(raw,fallback){
    try{
      if(!raw || raw === "None") return fallback;
      return JSON.parse(raw);
    }catch(_){ return fallback; }
  }

  function slides(images){
    QV.imgs = images && images.length ? images : [""];
    QV.i = 0;

    $("#qv-slides").innerHTML = QV.imgs.map((src,i)=>`
      <div class="qv-slide${i===0 ? " qv-active" : ""}">
        <img src="${safe(src)}" alt="Product ${i+1}" ${i ? 'loading="lazy"' : 'loading="eager"'}
             onerror="this.src='https://placehold.co/700x900/f6f6f6/111111?text=GUAMAISON'">
      </div>
    `).join("");

    $("#qv-dots").innerHTML = QV.imgs.map((_,i)=>`
      <button type="button" class="qv-dot${i===0 ? " qv-dot-active" : ""}" onclick="qvGoTo(${i})"></button>
    `).join("");

    const show = QV.imgs.length > 1;
    $$(".qv-nav").forEach(b => b.style.display = show ? "grid" : "none");
    $("#qv-dots").style.display = show ? "flex" : "none";
  }

  window.qvGoTo = function(n){
    const items = $$(".qv-slide");
    if(!items.length) return;

    items[QV.i]?.classList.remove("qv-active");
    QV.i = (n + items.length) % items.length;
    items[QV.i]?.classList.add("qv-active");

    $$(".qv-dot").forEach((d,i)=>d.classList.toggle("qv-dot-active", i === QV.i));
  };

  window.qvSlide = d => qvGoTo(QV.i + Number(d || 0));

  window.triggerQuickView = function(btn){
    const image = btn.dataset.image;
    let images = json(btn.dataset.images, []);
    if(!images.length && image) images = [image];

    openQuickView(
      btn.dataset.id,
      btn.dataset.slug,
      btn.dataset.name,
      btn.dataset.price,
      images,
      btn.dataset.category,
      parseInt(btn.dataset.stock,10) || 0,
      json(btn.dataset.variants, [])
    );
  };

  window.openQuickView = function(id,slug,name,price,images,category,stock,variants){
    QV.variants = Array.isArray(variants) ? variants : [];
    QV.base = parseFloat(price) || 0;
    QV.max = Math.max(1,stock || 1);

    $("#qv-input-id").value = id || "";
    $("#qv-variant-id").value = "";
    $("#qv-name").textContent = name || "Product";
    $("#qv-category").textContent = category || "GUAMAISON";
    $("#qv-detail-link").href = "/product/" + (slug || id || "");
    $("#qv-qty").value = 1;

    slides(images);
    $("#qv-price").textContent = money(QV.base);
    $("#qv-price-original").classList.add("hidden");

    if(QV.variants.length) renderColors();
    else{
      $("#qv-color-section").classList.add("hidden");
      $("#qv-size-section").classList.add("hidden");
      update(stock, QV.base, "");
    }

    const modal = $("#quick-view-modal");
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    modal.setAttribute("aria-hidden","false");

    requestAnimationFrame(()=>modal.classList.add("opacity-100"));
    document.body.style.overflow = "hidden";
  };

  function renderColors(){
    const colors = [];

    QV.variants.forEach(v=>{
      const name = v.color_name || v.color || "";
      if(name && !colors.some(c=>c.name === name)){
        colors.push({name,hex:v.color_hex || v.hex_code || v.hex || hex(name)});
      }
    });

    if(!colors.length){
      $("#qv-color-section").classList.add("hidden");
      $("#qv-size-section").classList.remove("hidden");
      renderSizes("");
      return;
    }

    $("#qv-color-section").classList.remove("hidden");
    $("#qv-size-section").classList.remove("hidden");

    $("#qv-colors").innerHTML = colors.map((c,i)=>`
      <button type="button" class="qv-swatch${i===0 ? " qv-sel" : ""}"
              style="background:${safe(c.hex)}" data-color="${safe(c.name)}"
              onclick="qvPickColor(this)" title="${safe(c.name)}"></button>
    `).join("");

    renderSizes(colors[0].name);
  }

  window.qvPickColor = function(btn){
    $$("#qv-colors .qv-swatch").forEach(b=>b.classList.remove("qv-sel"));
    btn.classList.add("qv-sel");
    renderSizes(btn.dataset.color || "");
  };

  function renderSizes(color){
    $("#qv-color-label").textContent = color || "";

    const vars = color
      ? QV.variants.filter(v => (v.color_name || v.color || "") === color)
      : QV.variants;

    const first = vars.find(v => Number(v.stock || 0) > 0);

    $("#qv-sizes").innerHTML = vars.map(v=>{
      const st = Number(v.stock || 0);
      const ok = st > 0;
      const sel = first && v.id === first.id;

      return `<button type="button" class="qv-size${sel ? " qv-sel" : ""}"
                data-vid="${safe(v.id)}"
                data-stock="${st}"
                data-price="${v.price_override || v.price || QV.base}"
                ${ok ? "" : "disabled"}
                onclick="qvPickSize(this)">${safe(v.size || v.size_name || "OS")}</button>`;
    }).join("");

    first ? update(first.stock, first.price_override || first.price || QV.base, first.id) : update(0, QV.base, "");
  }

  window.qvPickSize = function(btn){
    $$("#qv-sizes .qv-size").forEach(b=>b.classList.remove("qv-sel"));
    btn.classList.add("qv-sel");
    update(parseInt(btn.dataset.stock,10) || 0, parseFloat(btn.dataset.price) || QV.base, btn.dataset.vid || "");
  };

  function update(stock,price,variantId){
    $("#qv-variant-id").value = variantId || "";
    $("#qv-price").textContent = money(price);

    if(price && price < QV.base){
      $("#qv-price-original").textContent = money(QV.base);
      $("#qv-price-original").classList.remove("hidden");
    }else{
      $("#qv-price-original").classList.add("hidden");
    }

    const ok = stock > 0;
    QV.max = ok ? stock : 1;
    $("#qv-submit-btn").disabled = !ok;
    $("#qv-submit-btn").textContent = ok ? "Thêm vào giỏ" : "Hết hàng";
    $("#qv-stock-status").innerHTML = ok
      ? '<span style="color:#15803d">● Còn hàng</span>'
      : '<span style="color:#dc2626">● Hết hàng</span>';
    $("#qv-qty").value = 1;
  }

  window.qvChangeQty = function(delta){
    const el = $("#qv-qty");
    const next = Number(el.value || 1) + Number(delta || 0);
    if(next >= 1 && next <= QV.max) el.value = next;
  };

  window.closeQuickView = function(){
    const modal = $("#quick-view-modal");
    if(!modal) return;

    modal.classList.remove("opacity-100");
    modal.setAttribute("aria-hidden","true");

    setTimeout(()=>{
      modal.classList.remove("flex");
      modal.classList.add("hidden");
      document.body.style.overflow = "";
    },220);
  };

  document.addEventListener("keydown", e=>{
    if(e.key === "Escape") closeQuickView();
  });
})();
</script>
