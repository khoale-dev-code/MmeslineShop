{# app/templates/profile/address/_styles.html #}
<style>
  :root {
    --mm-ink: #241207;
    --mm-brown: #3b2414;
    --mm-brown-2: #5f3b1e;
    --mm-caramel: #b98b62;
    --mm-muted: #8a6a52;
    --mm-line: #eadfd4;
    --mm-soft: #fffaf5;
    --mm-cream: #fbf7f1;
    --mm-card: #fffdf9;
  }

  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }

  /* Input dùng lại class cũ .gua-input để không cần sửa HTML */
  .gua-input {
    display: block;
    width: 100%;
    height: 3.25rem;
    padding: 0 1rem;
    border: 1px solid var(--mm-line);
    border-radius: 18px;
    background: #ffffff;
    color: var(--mm-ink);
    font-size: 0.875rem;
    font-weight: 750;
    outline: none;
    transition:
      border-color 0.16s ease,
      box-shadow 0.16s ease,
      background 0.16s ease;
  }

  .gua-input::placeholder {
    color: #b7a191;
    font-weight: 600;
  }

  .gua-input:hover:not(:disabled) {
    border-color: rgba(95, 59, 30, 0.38);
  }

  .gua-input:focus {
    border-color: rgba(95, 59, 30, 0.52);
    background: #fffdf9;
    box-shadow: 0 0 0 4px rgba(185, 139, 98, 0.14);
  }

  .gua-input:disabled {
    background: #f6eee7;
    color: #b7a191;
    cursor: not-allowed;
  }

  .gua-input:not(:placeholder-shown):invalid {
    border-color: rgba(220, 38, 38, 0.65);
    background: #fff1f2;
    box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
  }

  .gua-select {
    display: block;
    width: 100%;
    height: 3.25rem;
    padding: 0 2.75rem 0 1rem;
    border: 1px solid var(--mm-line);
    border-radius: 18px;
    background: #ffffff;
    color: var(--mm-ink);
    font-size: 0.875rem;
    font-weight: 750;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition:
      border-color 0.16s ease,
      box-shadow 0.16s ease,
      background 0.16s ease,
      opacity 0.16s ease;
  }

  .gua-select:hover:not(:disabled) {
    border-color: rgba(95, 59, 30, 0.38);
  }

  .gua-select:focus {
    border-color: rgba(95, 59, 30, 0.52);
    background: #fffdf9;
    box-shadow: 0 0 0 4px rgba(185, 139, 98, 0.14);
  }

  .gua-select:disabled {
    background: #f6eee7;
    color: #b7a191;
    cursor: not-allowed;
    opacity: 0.7;
  }

  .gua-chevron {
    position: absolute;
    right: 1rem;
    top: 50%;
    width: 1rem;
    height: 1rem;
    transform: translateY(-50%);
    color: var(--mm-caramel);
    pointer-events: none;
    transition:
      transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
      color 0.16s ease;
  }

  .gua-select:focus + .gua-chevron {
    transform: translateY(-50%) rotate(180deg);
    color: var(--mm-brown);
  }

  /* Modal visibility */
  #addr-modal,
  #delete-dialog {
    display: none;
  }

  #addr-modal.is-open,
  #delete-dialog.is-open {
    display: flex !important;
  }

  #modal-backdrop,
  #del-backdrop {
    opacity: 0;
    background: rgba(36, 18, 7, 0.52);
    backdrop-filter: blur(8px);
    transition: opacity 0.26s ease;
  }

  #addr-modal.is-open #modal-backdrop,
  #delete-dialog.is-open #del-backdrop {
    opacity: 1;
  }

  #modal-panel,
  #del-panel {
    opacity: 0;
    border: 1px solid var(--mm-line);
    background: var(--mm-card);
    box-shadow: 0 34px 100px -58px rgba(36, 18, 7, 0.76);
    transition:
      opacity 0.28s ease,
      transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Mobile: bottom sheet */
  @media (max-width: 767px) {
    #modal-panel,
    #del-panel {
      width: 100%;
      max-height: 92dvh;
      margin-top: auto;
      border-bottom-left-radius: 0 !important;
      border-bottom-right-radius: 0 !important;
      transform: translateY(100%);
    }

    #addr-modal.is-open #modal-panel,
    #delete-dialog.is-open #del-panel {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Desktop: centered modal */
  @media (min-width: 768px) {
    #modal-panel,
    #del-panel {
      margin: auto;
      border-radius: 28px !important;
      transform: scale(0.96) translateY(10px);
    }

    #addr-modal.is-open #modal-panel,
    #delete-dialog.is-open #del-panel {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  /* Address card enhancement */
  .addr-card {
    will-change: transform, box-shadow;
    transition:
      transform 0.18s ease,
      border-color 0.18s ease,
      box-shadow 0.18s ease;
  }

  .addr-card:hover {
    border-color: rgba(95, 59, 30, 0.42);
    box-shadow: 0 26px 70px -50px rgba(36, 18, 7, 0.72);
    transform: translateY(-2px);
  }

  .addr-card--default {
    border-color: var(--mm-brown) !important;
  }

  .addr-note {
    border-left: 3px solid var(--mm-caramel);
    background: var(--mm-cream);
    color: var(--mm-muted);
  }

  /* Button loading support */
  #btn-submit:disabled {
    cursor: wait;
    opacity: 0.72;
  }

  /* Small scrollbar inside modal */
  #modal-panel ::-webkit-scrollbar,
  #del-panel ::-webkit-scrollbar {
    width: 6px;
  }

  #modal-panel ::-webkit-scrollbar-track,
  #del-panel ::-webkit-scrollbar-track {
    background: #fbf7f1;
  }

  #modal-panel ::-webkit-scrollbar-thumb,
  #del-panel ::-webkit-scrollbar-thumb {
    background: #d8c6b6;
    border-radius: 999px;
  }

  #modal-panel ::-webkit-scrollbar-thumb:hover,
  #del-panel ::-webkit-scrollbar-thumb:hover {
    background: #b98b62;
  }

  @media (prefers-reduced-motion: reduce) {
    #modal-backdrop,
    #del-backdrop,
    #modal-panel,
    #del-panel,
    .gua-input,
    .gua-select,
    .gua-chevron,
    .addr-card {
      transition: none !important;
    }
  }
</style>
<style>
  body.mm-modal-open {
    overflow: hidden !important;
    touch-action: none;
  }

  #addr-modal {
    position: fixed !important;
    inset: 0 !important;
    z-index: 2147483000 !important;
  }

  #addr-modal.is-open {
    display: flex !important;
  }

  #modal-backdrop {
    z-index: 2147483001 !important;
  }

  #modal-panel {
    z-index: 2147483002 !important;
  }

  @media (max-width: 767px) {
    #modal-panel {
      max-height: 94dvh !important;
      width: 100% !important;
    }
  }
</style>
