{# app/templates/profile/address/_delete_dialog.html #}

<div
  id="delete-dialog"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="del-title"
  aria-describedby="del-desc"
  aria-hidden="true"
  style="display:none"
  class="fixed inset-0 z-[9995] hidden items-end justify-center font-sans sm:items-center sm:p-4"
>
  <div
    id="del-backdrop"
    class="fixed inset-0 cursor-pointer bg-[#241207]/55 opacity-0 backdrop-blur-md transition-opacity duration-300"
    aria-hidden="true"
    onclick="GUA.deleteDialog.cancel()"
  ></div>

  <div
    id="del-panel"
    class="relative z-[9996] flex w-full max-w-[460px] flex-col overflow-hidden rounded-t-[28px] border border-[#eadfd4] bg-[#fffaf5] opacity-0 shadow-[0_34px_100px_-58px_rgba(36,18,7,.78)] transition-all duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] sm:rounded-[30px]"
  >
    <button
      type="button"
      class="absolute left-1/2 top-3 z-20 h-1.5 w-12 -translate-x-1/2 rounded-full bg-[#d8c6b6] sm:hidden"
      onclick="GUA.deleteDialog.cancel()"
      aria-label="Đóng"
    ></button>

    <button
      type="button"
      onclick="GUA.deleteDialog.cancel()"
      aria-label="Đóng"
      class="absolute right-5 top-5 z-20 flex h-10 w-10 items-center justify-center rounded-2xl border border-[#eadfd4] bg-[#fffdf9] text-[#8a6a52] transition hover:bg-[#3b2414] hover:text-white"
    >
      <i class="fa-solid fa-xmark text-sm"></i>
    </button>

    <div class="relative px-5 pb-6 pt-12 text-center sm:px-8 sm:pb-8 sm:pt-10">
      <div class="absolute right-0 top-0 h-28 w-28 rounded-full bg-red-500/10 blur-3xl"></div>

      <div class="relative z-10">
        <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-[24px] border border-red-200 bg-red-50 text-red-600 shadow-[0_18px_38px_-30px_rgba(220,38,38,.5)]">
          <i class="fa-solid fa-trash-can text-xl"></i>
        </div>

        <p class="mb-2 text-[10px] font-black uppercase tracking-[.24em] text-[#b98b62]">
          MMESTLINE Address
        </p>

        <h3
          id="del-title"
          class="text-2xl font-black tracking-[-.05em] text-[#241207]"
        >
          Xóa địa chỉ này?
        </h3>

        <p
          id="del-desc"
          class="mx-auto mt-4 max-w-sm text-sm font-semibold leading-7 text-[#8a6a52]"
        >
          Địa chỉ của
          <strong
            id="del-name"
            class="font-black text-[#241207]"
          ></strong>
          sẽ bị xóa khỏi sổ địa chỉ. Hành động này không thể hoàn tác.
        </p>

        <div class="mt-7 rounded-[22px] border border-amber-200 bg-amber-50 px-4 py-3 text-left">
          <div class="flex items-start gap-3">
            <span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-2xl bg-white text-amber-600">
              <i class="fa-solid fa-triangle-exclamation text-xs"></i>
            </span>

            <p class="text-xs font-bold leading-6 text-amber-800">
              Nếu đây là địa chỉ mặc định, bạn nên chọn một địa chỉ mặc định khác trước khi xóa để tránh lỗi khi thanh toán.
            </p>
          </div>
        </div>

        <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row">
          <button
            type="button"
            onclick="GUA.deleteDialog.cancel()"
            class="flex h-12 flex-1 items-center justify-center rounded-2xl border border-[#eadfd4] bg-[#fffdf9] px-5 text-[10px] font-black uppercase tracking-[.16em] text-[#75543f] transition hover:bg-[#fbf7f1] hover:text-[#241207]"
          >
            Hủy bỏ
          </button>

          <button
            type="button"
            onclick="GUA.deleteDialog.confirm()"
            class="flex h-12 flex-1 items-center justify-center gap-2 rounded-2xl bg-red-600 px-5 text-[10px] font-black uppercase tracking-[.16em] text-white shadow-[0_18px_38px_-28px_rgba(220,38,38,.7)] transition hover:bg-red-700 active:scale-[.98]"
          >
            <i class="fa-solid fa-trash-can text-xs"></i>
            Xóa địa chỉ
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<form id="delete-form" method="POST" class="hidden">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
</form>
