{% extends "admin/admin_base.html" %}
{% block title %}Sửa Danh mục | GUA Admin{% endblock %}

{% block extra_head %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
</style>
{% endblock %}

{% block content %}
<form method="POST" class="max-w-xl mx-auto px-4 py-12 space-y-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="flex items-center justify-between border-b border-slate-200/60 pb-5">
        <div class="flex items-center gap-3">
            <a href="{{ url_for('admin.categories') }}" class="w-9 h-9 border border-slate-200 rounded-full flex items-center justify-center text-slate-400 hover:text-black hover:border-black transition-all"><i class="fa-solid fa-arrow-left text-xs"></i></a>
            <h1 class="text-xl font-bold text-slate-900">Sửa đổi danh mục</h1>
        </div>
        <button type="submit" class="bg-black text-white text-xs font-bold uppercase tracking-wide px-5 py-2.5 rounded-full hover:bg-stone-800 transition-colors">Lưu lại</button>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4 shadow-sm">
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Tên danh mục</label>
            <input type="text" name="name" value="{{ cat.name }}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:outline-none focus:bg-white focus:border-black transition-all">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Đường dẫn tĩnh (Slug)</label>
            <input type="text" name="slug" value="{{ cat.slug }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-mono text-slate-400 focus:outline-none focus:bg-white focus:border-black transition-all">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Mô tả</label>
            <textarea name="description" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:border-black transition-all">{{ cat.description or '' }}</textarea>
        </div>
        <label class="flex items-center justify-between cursor-pointer pt-2">
            <span class="text-xs font-bold text-slate-500 uppercase">Trạng thái bật bán</span>
            <div class="relative">
                <input type="checkbox" name="is_active" class="sr-only peer" {% if cat.is_active %}checked{% endif %}>
                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-black"></div>
            </div>
        </label>
    </div>
</form>
{% endblock %}
