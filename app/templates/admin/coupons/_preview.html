<aside class="gpa-preview" aria-label="Xem trước voucher">
  <button class="gpa-preview__toggle" type="button" data-preview-toggle aria-expanded="false"><span><i class="fa-regular fa-eye" aria-hidden="true"></i> Xem trước voucher</span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
  <div class="gpa-preview__panel" data-preview-panel>
    <div class="gpa-preview__sticky">
      <header><span><i class="fa-solid fa-circle" aria-hidden="true"></i> Xem trước trực tiếp</span><b data-preview-channel>Website & POS</b></header>
      <div class="gpa-ticket">
        <div class="gpa-ticket__media" data-preview-media><span>G/M</span><img data-preview-image alt="Ảnh voucher đang xem trước" hidden><small>GUAMAISON MEMBER PRIVILEGE</small></div>
        <div class="gpa-ticket__body">
          <p data-preview-type>Ưu đãi thành viên</p>
          <strong data-preview-value>0%</strong>
          <span data-preview-description>Quyền lợi dành riêng cho khách hàng GUAMAISON.</span>
          <div><small><i class="fa-solid fa-bag-shopping" aria-hidden="true"></i> Đơn từ <b data-preview-min>0₫</b></small><small><i class="fa-solid fa-star" aria-hidden="true"></i> Điểm <b data-preview-points>0</b></small></div>
        </div>
        <footer><span><small>Mã ưu đãi</small><b data-preview-code>------</b></span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></footer>
      </div>
      <p class="gpa-preview__note"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span>Storefront dùng cùng dữ liệu này; checkout sẽ kiểm tra lại toàn bộ điều kiện trước khi áp dụng.</span></p>
    </div>
  </div>
</aside>
