{% extends "admin/admin_base.html" %}
{% block title %}Biểu mẫu Bộ sưu tập | GUA Admin{% endblock %}

{% block extra_head %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background-color:#f8fafc;}</style>
{% endblock %}

{% block content %}
<form method="POST" enctype="multipart/form-data" class="max-w-5xl mx-auto px-4 py-12 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-3xl p-6 space-y-6 shadow-sm">
        <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
            <a href="{{ url_for('admin.collections') }}" class="w-8 h-8 border border-slate-200 rounded-full flex items-center justify-center text-slate-400 hover:text-black"><i class="fa-solid fa-arrow-left text-xs"></i></a>
            <h2 class="text-base font-bold text-slate-900">Thông tin bộ sưu tập</h2>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Tên bộ sưu tập chiến dịch *</label>
            <input type="text" name="name" value="{{ cat.name if cat else '' }}" required placeholder="Vd: Summer Lookbook 2026" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold focus:outline-none focus:bg-white focus:border-indigo-500 transition-all">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Mô tả thông điệp</label>
            <textarea name="description" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:border-indigo-500 transition-all">{{ cat.description if cat else '' }}</textarea>
        </div>
        <div class="border-t border-slate-100 pt-4 space-y-4">
            <label class="block text-xs font-bold text-slate-500 uppercase">Dán đường dẫn URL Media</label>
            <input type="url" name="external_url" value="{{ cat.video_url if cat and cat.video_url else (cat.image_url if cat else '') }}" placeholder="Hỗ trợ link ảnh tĩnh hoặc link file .mp4 từ iCloud/Drive..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition-all">
            <div class="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center bg-slate-50 hover:bg-slate-100/50 transition-colors relative cursor-pointer" onclick="document.getElementById('f').click()">
                <input type="file" id="f" name="collection_media" accept="image/*,video/mp4" class="hidden">
                <i class="fa-solid fa-photo-film text-slate-300 text-2xl mb-2"></i>
                <p class="text-xs font-bold text-slate-600">Hoặc tải file từ máy tính lên hệ thống Storage</p>
            </div>
        </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-sm h-fit">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Cấu hình luồng</h3>
        <label class="flex items-center justify-between cursor-pointer p-3 bg-slate-50 rounded-xl">
            <span class="text-xs font-bold text-slate-600 uppercase">Kích hoạt chiến dịch</span>
            <div class="relative inline-flex items-center">
                <input type="checkbox" name="is_active" class="sr-only peer" {% if not cat or cat.is_active %}checked{% endif %}>
                <div class="w-8 h-4 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600"></div>
            </div>
        </label>
        <label class="flex items-center justify-between cursor-pointer p-3 bg-amber-50/50 rounded-xl border border-amber-100">
            <span class="text-xs font-bold text-amber-800 uppercase">Đưa ra ngoài trang chủ</span>
            <div class="relative inline-flex items-center">
                <input type="checkbox" name="show_on_home" class="sr-only peer" {% if cat and cat.show_on_home %}checked{% endif %}>
                <div class="w-8 h-4 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-amber-500"></div>
            </div>
        </label>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider mt-4 transition-colors">Xác nhận lưu</button>
    </div>
</form>
{% endblock %}
