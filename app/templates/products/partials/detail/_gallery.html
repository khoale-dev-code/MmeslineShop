<section class="pd-gallery {% if images|length > 1 %}has-thumbs{% endif %}">
        {% if images|length > 1 %}
          <div class="pd-thumbs no-scrollbar" id="pdThumbs">
            {% for img in images %}
              <button
                type="button"
                class="pd-thumb {% if loop.first %}is-active{% endif %}"
                data-url="{{ img.url }}"
                data-index="{{ loop.index0 }}"
                aria-label="Xem ảnh {{ loop.index }}"
              >
                <img
                  src="{{ img.url }}"
                  alt="{{ product.name }} {{ loop.index }}"
                  width="148"
                  height="184"
                  decoding="async"
                  loading="{{ 'eager' if loop.index <= 4 else 'lazy' }}"
                  onerror="this.src='https://placehold.co/300x400/f6f6f6/111111?text=GUAMAISON'"
                >
              </button>
            {% endfor %}
          </div>
        {% endif %}

        <div class="pd-main">
          {% if product.has_discount %}
            <div id="main-discount-badge" class="pd-discount">-{{ product.discount_percent }}%</div>
          {% else %}
            <div id="main-discount-badge" class="pd-discount hidden"></div>
          {% endif %}

          <img
            id="main-focus-image"
            src="{{ images[0].url if images else 'https://placehold.co/900x1200/f6f6f6/111111?text=GUAMAISON' }}"
            alt="{{ product.name }}"
            width="900"
            height="1200"
            fetchpriority="high"
            loading="eager"
            decoding="async"
            onerror="this.src='https://placehold.co/900x1200/f6f6f6/111111?text=GUAMAISON'"
          >

          <button type="button" id="btn-wishlist" class="pd-wishlist" aria-label="Thêm vào yêu thích">
            <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/>
            </svg>
          </button>
        </div>
      </section>
