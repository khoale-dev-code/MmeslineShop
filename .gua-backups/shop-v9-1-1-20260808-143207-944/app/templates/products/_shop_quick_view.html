<div class="gua-shop-quick" id="shopQuickView" data-shop-quick-view aria-hidden="true">
  <button type="button" class="gua-shop-quick__backdrop" data-shop-close-quick aria-label="Đóng xem nhanh"></button>

  <section class="gua-shop-quick__panel" role="dialog" aria-modal="true" aria-labelledby="shopQuickTitle">
    <span class="gua-shop-quick__handle" aria-hidden="true"></span>
    <button type="button" class="gua-shop-icon-button gua-shop-quick__close" data-shop-close-quick aria-label="Đóng xem nhanh">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>

    <div class="gua-shop-quick__layout">
      <figure class="gua-shop-quick__media">
        <img data-shop-quick-image src="" alt="" width="800" height="1000" decoding="async">
      </figure>

      <div class="gua-shop-quick__content">
        <div>
          <p class="gua-shop-eyebrow" data-shop-quick-category>GUAMAISON</p>
          <h2 id="shopQuickTitle" data-shop-quick-title></h2>
          <p class="gua-shop-quick__price" data-shop-quick-price></p>

          <label class="gua-shop-quick__field">
            <span>Phân loại</span>
            <select data-shop-quick-variant></select>
          </label>
        </div>

        <div class="gua-shop-quick__actions">
          <button type="button" class="gua-shop-button gua-shop-button--dark" data-shop-quick-add>
            <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
            Thêm vào giỏ
          </button>
          <a href="/shop" class="gua-shop-button gua-shop-button--ghost" data-shop-quick-link data-nav>
            Xem chi tiết
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </section>
</div>
