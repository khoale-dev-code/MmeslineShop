<div class="gua-confirm" data-delete-dialog hidden>
  <button type="button" class="gua-confirm__backdrop" data-cancel-delete aria-label="Hủy xóa"></button>
  <section role="alertdialog" aria-modal="true" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-copy" tabindex="-1">
    <span class="gua-confirm__icon"><i class="fa-regular fa-trash-can"></i></span>
    <p class="gua-cart__eyebrow">Xóa hàng loạt</p>
    <h2 id="delete-dialog-title">Xóa các sản phẩm đã chọn?</h2>
    <p id="delete-dialog-copy" data-delete-copy>Thao tác này sẽ xóa sản phẩm khỏi giỏ hàng của bạn.</p>
    <div>
      <button type="button" data-cancel-delete>Giữ lại</button>
      <button type="button" class="is-danger" data-confirm-delete>Xóa sản phẩm</button>
    </div>
  </section>
</div>
